name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python range on Linux; oldest and newest supported Python on Windows and macOS.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check baby tests

      - name: Type check with mypy
        run: mypy baby

      - name: Run tests (coverage floor 90%)
        run: python -m pytest --cov=baby --cov-fail-under=90 tests/ -v

  contract:
    name: API contract and TypeScript client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Baby
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: OpenAPI schema and TypeScript types match the backend
        run: python scripts/generate_ts_types.py --check

      - uses: actions/setup-node@v4
        with:
          # The client tests use --experimental-strip-types (Node >= 22.6).
          node-version: "22"

      - name: Build and test the TypeScript client
        working-directory: clients/typescript
        run: |
          npm ci
          npm test

  package:
    name: wheel install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel into a clean virtual environment and import it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python -c "import baby, baby.api.app, baby.workers; print('baby', baby.__version__)"
          /tmp/wheel-env/bin/python -m baby.workers --help

  audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies into a clean virtual environment
        run: |
          python -m venv /tmp/audit-env
          /tmp/audit-env/bin/python -m pip install --upgrade pip
          /tmp/audit-env/bin/python -m pip install .

      - name: Audit runtime dependencies with pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit --progress-spinner off --path "$(/tmp/audit-env/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
